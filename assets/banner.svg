<svg width="100%" height="100%" viewBox="0 0 960 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Elegant Peach-to-Pink Linear Gradient -->
    <linearGradient id="peachPinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="30%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <!-- Subtle Ambient Radial Glow for Depth -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Layer 1 Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22" />
    </linearGradient>

    <!-- Wave Layer 2 Gradient -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.30" />
    </linearGradient>

    <!-- Text Drop Shadow Filter -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#881337" flood-opacity="0.22" />
    </filter>

    <filter id="subShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#881337" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.8px;
      fill: #ffffff;
      opacity: 0.96;
    }
  </style>

  <!-- Base Rectangle with Rounded Corners -->
  <rect width="960" height="220" rx="14" fill="url(#peachPinkGradient)" />

  <!-- Soft Ambient Radial Overlay -->
  <rect width="960" height="220" rx="14" fill="url(#ambientGlow)" />

  <!-- Smooth Subtle Wave Divider (Back Layer) -->
  <path d="M0,185 C160,165 320,205 480,185 C640,165 800,205 960,185 L960,220 L0,220 Z" fill="url(#waveGrad1)" />

  <!-- Smooth Subtle Wave Divider (Front Layer) -->
  <path d="M0,198 C180,182 340,214 520,196 C700,180 840,212 960,198 L960,220 L0,220 Z" fill="url(#waveGrad2)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="0.5" y="0.5" width="959" height="219" rx="13.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Hero Content (Centered Horizontally & Vertically) -->
  <g text-anchor="middle">
    <!-- Name -->
    <text x="480" y="105" class="name-text" filter="url(#textShadow)">Sahil Raj</text>

    <!-- Subtitle -->
    <text x="480" y="145" class="subtitle-text" filter="url(#subShadow)">Software Development Engineer | Product Designer</text>
  </g>
</svg>
