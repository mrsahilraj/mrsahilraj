<svg width="100%" height="100%" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="85%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Radial Highlight -->
    <radialGradient id="cyanGlow" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Wave Filter / Shadow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3.5px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .status-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="220" rx="14" fill="url(#bgGradient)" />

  <!-- Ambient Glow -->
  <rect width="900" height="220" rx="14" fill="url(#cyanGlow)" />

  <!-- Background Tech Grid Lines (Subtle) -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="220" />
    <line x1="200" y1="0" x2="200" y2="220" />
    <line x1="300" y1="0" x2="300" y2="220" />
    <line x1="400" y1="0" x2="400" y2="220" />
    <line x1="500" y1="0" x2="500" y2="220" />
    <line x1="600" y1="0" x2="600" y2="220" />
    <line x1="700" y1="0" x2="700" y2="220" />
    <line x1="800" y1="0" x2="800" y2="220" />
    <line x1="0" y1="55" x2="900" y2="55" />
    <line x1="0" y1="110" x2="900" y2="110" />
    <line x1="0" y1="165" x2="900" y2="165" />
  </g>

  <!-- Subtle Elegant Wave at Bottom -->
  <path d="M0,195 C200,175 350,210 550,190 C720,175 800,205 900,195 L900,220 L0,220 Z" fill="#0284c7" fill-opacity="0.12" />
  <path d="M0,205 C180,190 320,215 500,200 C680,185 820,215 900,205 L900,220 L0,220 Z" fill="#38bdf8" fill-opacity="0.08" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="899" height="219" rx="13.5" stroke="#38bdf8" stroke-opacity="0.25" />

  <!-- Top Pill Badge -->
  <g transform="translate(450, 42)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="-92" cy="0" r="4.5" fill="#38bdf8" />
    <text x="-78" y="4" class="status-badge">PORTFOLIO &amp; ARCHITECTURE</text>
  </g>

  <!-- Center Main Title: Sahil Raj -->
  <g filter="url(#softGlow)">
    <text x="450" y="118" text-anchor="middle" class="name-text">Sahil Raj</text>
  </g>

  <!-- Accent Divider Line Under Name -->
  <rect x="300" y="134" width="300" height="2" rx="1" fill="url(#accentGradient)" />

  <!-- Subtitle: Role & Specialty -->
  <text x="450" y="165" text-anchor="middle" class="role-text">Software Development Engineer | Product Designer</text>

  <!-- Decorative Corner Brackets (Dev Aesthetics) -->
  <path d="M 24,36 L 24,24 L 36,24" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <path d="M 876,36 L 876,24 L 864,24" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <path d="M 24,184 L 24,196 L 36,196" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <path d="M 876,184 L 876,196 L 864,196" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
</svg>
